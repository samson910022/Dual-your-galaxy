# Release: builds APKs and attaches them to a GitHub Release on tags.
name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Check out the tagged commit.
      - uses: actions/checkout@v4
      # Provision JDK 17 to match the build matrix.
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      # Provision Gradle for tag builds.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
      # Build release APKs with the committed wrapper (pinned Gradle 8.7); fail fast on errors.
      - name: Build release APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon
      # Generate SHA256 checksums for every built APK.
      - name: Generate SHA256 checksums
        run: |
          shopt -s nullglob
          apks=(app/build/outputs/apk/release/*.apk app/build/outputs/apk/debug/*.apk)
          if [ ${#apks[@]} -eq 0 ]; then
            echo "no APKs built (skeleton placeholder), writing empty checksums file"
            mkdir -p app/build/outputs/apk/release
            : > app/build/outputs/apk/release/SHA256SUMS.txt
          else
            sha256sum "${apks[@]}" > SHA256SUMS.txt
            echo "--- SHA256SUMS.txt ---"
            cat SHA256SUMS.txt
            mkdir -p app/build/outputs/apk/release
            cp SHA256SUMS.txt app/build/outputs/apk/release/SHA256SUMS.txt
          fi
      # Publish a GitHub Release with built APKs + SHA256.
      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/release/SHA256SUMS.txt
            SHA256SUMS.txt
          generate_release_notes: true
          fail_on_unmatched_files: false
