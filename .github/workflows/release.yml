# Release: builds signed APKs and attaches them to a GitHub Release on tags.
#
# Signing (Phase E1, issue #5): the release keystore is restored from the
# SIGN_STORE_BASE64 secret and injected into Gradle via SIGN_STORE_FILE plus
# SIGN_STORE_PASSWORD / SIGN_KEY_ALIAS / SIGN_KEY_PASSWORD. No keystore or key
# material is ever committed (see docs/KEY_MANAGEMENT.md). Any missing secret,
# unsigned output, or apksigner failure stops the job before publishing.
# STATUS (as of 2026-11-04): SIGN_* secrets configured; tag
# v0.0.0-dryrun run 41800791298 passed end-to-end: keystore restore +
# assembleRelease + apksigner verify + single SHA256SUMS.txt (SHA-256,
# sha256sum -c verified); same-run attempts 1-2 red as observed (base64
# invalid / password incorrect), attempt 3 green; fail-closed by design;
# CI green covers build+verify, manual download verified + cert match per #5
# comment. Push tags v* trigger this same workflow; re-verify on first real v*
# or after rotation/workflow change. Green non-tag CI does not prove tag path.
name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Check out the tagged commit.
      - uses: actions/checkout@v4
      # Provision JDK 17 to match the build matrix.
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      # Provision Gradle for tag builds.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
      # Restore the release keystore from secrets; fail fast when any secret
      # is missing instead of producing an unsigned build.
      - name: Restore release keystore
        env:
          SIGN_STORE_BASE64: ${{ secrets.SIGN_STORE_BASE64 }}
          SIGN_STORE_PASSWORD: ${{ secrets.SIGN_STORE_PASSWORD }}
          SIGN_KEY_ALIAS: ${{ secrets.SIGN_KEY_ALIAS }}
          SIGN_KEY_PASSWORD: ${{ secrets.SIGN_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=()
          [ -n "${SIGN_STORE_BASE64:-}" ] || missing+=("SIGN_STORE_BASE64")
          [ -n "${SIGN_STORE_PASSWORD:-}" ] || missing+=("SIGN_STORE_PASSWORD")
          [ -n "${SIGN_KEY_ALIAS:-}" ] || missing+=("SIGN_KEY_ALIAS")
          [ -n "${SIGN_KEY_PASSWORD:-}" ] || missing+=("SIGN_KEY_PASSWORD")
          if [ "${#missing[@]}" -ne 0 ]; then
            echo "::error::Missing required signing secrets: ${missing[*]}; refusing unsigned release build."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/signing"
          echo "$SIGN_STORE_BASE64" | base64 -d > "$RUNNER_TEMP/signing/release.jks"
          chmod 600 "$RUNNER_TEMP/signing/release.jks"
          echo "SIGN_STORE_FILE=$RUNNER_TEMP/signing/release.jks" >> "$GITHUB_ENV"
      # Run :app + :core + :hook unit tests before building release bytes.
      # Fail fast so a broken commit never produces/publishes a release APK.
      - name: Unit tests (app, core, hook debug)
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew :app:testDebugUnitTest :core:testDebugUnitTest :hook:testDebugUnitTest --no-daemon
      # Build release APKs with the committed wrapper (pinned Gradle 8.7); fail fast on errors.
      - name: Build release APK
        env:
          SIGN_STORE_PASSWORD: ${{ secrets.SIGN_STORE_PASSWORD }}
          SIGN_KEY_ALIAS: ${{ secrets.SIGN_KEY_ALIAS }}
          SIGN_KEY_PASSWORD: ${{ secrets.SIGN_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon
      # B2 (release): verify ShizukuProvider survives into the released DEX.
      - name: APK ShizukuProvider DEX check (release)
        run: |
          set -euo pipefail
          echo "== (a) manifest declares rikka.shizuku.ShizukuProvider =="
          grep -F "rikka.shizuku.ShizukuProvider" app/src/main/AndroidManifest.xml || { echo "::error::ShizukuProvider (rikka.shizuku.ShizukuProvider) not declared in app/src/main/AndroidManifest.xml"; exit 1; }
          shopt -s nullglob
          apks=(app/build/outputs/apk/release/*.apk)
          if [ "${#apks[@]}" -eq 0 ]; then
            echo "::error::No release APKs built; refusing to run DEX checks."
            exit 1
          fi
          for apk in "${apks[@]}"; do
            echo "--- checking $apk ---"
            if [ ! -f "$apk" ]; then
              echo "::error::Release APK not found: $apk"
              exit 1
            fi
            FOUND=0
            for dex in $(unzip -l "$apk" | grep -o 'classes[0-9]*\.dex'); do
              echo "--- scanning $dex ---"
              if unzip -p "$apk" "$dex" | grep -q "ShizukuProvider"; then
                echo "FOUND ShizukuProvider in $dex"
                FOUND=1
              fi
            done
            if [ "$FOUND" -eq 0 ]; then
              echo "::error::ShizukuProvider class string not found in $apk"
              exit 1
            fi
          done
          echo "PASS: ShizukuProvider present in manifest and release DEX"
      # D1 (release): verify the hook entry survives into the released APK.
      - name: APK hook entry check (release)
        run: |
          set -euo pipefail
          shopt -s nullglob
          apks=(app/build/outputs/apk/release/*.apk)
          if [ "${#apks[@]}" -eq 0 ]; then
            echo "::error::No release APKs built; refusing to run DEX checks."
            exit 1
          fi
          for apk in "${apks[@]}"; do
            echo "--- checking $apk ---"
            if [ ! -f "$apk" ]; then
              echo "::error::Release APK not found: $apk"
              exit 1
            fi
            echo "== (a) META-INF/xposed resources present in APK =="
            for entry in META-INF/xposed/java_init.list META-INF/xposed/module.prop META-INF/xposed/scope.list; do
              if unzip -l "$apk" | grep -Fq "$entry"; then
                echo "FOUND $entry"
              else
                echo "::error::$entry missing in $apk"
                exit 1
              fi
            done
            echo "== (b) java_init.list points at DualHook =="
            if unzip -p "$apk" META-INF/xposed/java_init.list | grep -Fq "com.galaxydual.hook.DualHook"; then
              echo "FOUND DualHook entry in java_init.list"
            else
              echo "::error::DualHook entry missing in META-INF/xposed/java_init.list"
              exit 1
            fi
            echo "== (c) DEX contains DualHook =="
            FOUND=0
            for dex in $(unzip -l "$apk" | grep -o 'classes[0-9]*\.dex'); do
              echo "--- scanning $dex ---"
              if unzip -p "$apk" "$dex" | grep -q "DualHook"; then
                echo "FOUND DualHook in $dex"
                FOUND=1
              fi
            done
            if [ "$FOUND" -eq 0 ]; then
              echo "::error::DualHook class string not found in $apk"
              exit 1
            fi
          done
          echo "PASS: hook entry (DualHook + xposed resources) present in release APK"
      # Gate: every release APK must carry a valid signature; unsigned or
      # unverifiable output stops the job before any checksum or publish step.
      - name: Verify release signatures
        run: |
          set -euo pipefail
          shopt -s nullglob
          apks=(app/build/outputs/apk/release/*.apk)
          if [ "${#apks[@]}" -eq 0 ]; then
            echo "::error::No release APKs built; refusing to publish an empty release."
            exit 1
          fi
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)/apksigner"
          if [ ! -x "$apksigner" ]; then
            echo "::error::apksigner not found under \$ANDROID_HOME/build-tools; cannot verify signatures."
            exit 1
          fi
          : > "$RUNNER_TEMP/verified_apks.txt"
          for apk in "${apks[@]}"; do
            echo "--- verifying $apk ---"
            if "$apksigner" verify --verbose --print-certs "$apk"; then
              echo "$apk" >> "$RUNNER_TEMP/verified_apks.txt"
            else
              echo "::error::Signature verification FAILED for $apk; refusing to publish."
              exit 1
            fi
          done
          echo "--- verified APKs ---"
          cat "$RUNNER_TEMP/verified_apks.txt"
      # Generate a single SHA256SUMS.txt (issue #5: only one) in the release dir
      # with bare file names so `sha256sum -c` verifies directly. Zero verified
      # APKs is a failure: never write or publish an empty SHA256SUMS.
      - name: Generate SHA256 checksums
        run: |
          set -euo pipefail
          mapfile -t apks < "$RUNNER_TEMP/verified_apks.txt"
          if [ "${#apks[@]}" -eq 0 ]; then
            echo "::error::No verified APKs; refusing to write an empty SHA256SUMS."
            exit 1
          fi
          rm -f SHA256SUMS.txt app/build/outputs/apk/release/SHA256SUMS.txt
          (
            cd app/build/outputs/apk/release
            names=()
            for a in "${apks[@]}"; do names+=("$(basename "$a")"); done
            sha256sum "${names[@]}" > SHA256SUMS.txt
            sha256sum -c SHA256SUMS.txt
            echo "--- SHA256SUMS.txt (release dir, bare names) ---"
            cat SHA256SUMS.txt
          )
      # Publish a GitHub Release with verified APKs + SHA256.
      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/release/SHA256SUMS.txt
          generate_release_notes: true
          fail_on_unmatched_files: true
