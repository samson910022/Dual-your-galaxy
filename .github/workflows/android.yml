# CI: build, test, and lint on every push/PR.
name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Phase A1: least-privilege top-level permissions (checkout + cache only need read).
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Check out the repository.
      - uses: actions/checkout@v4
      # Provision JDK 17 required by AGP 8.x and Kotlin 2.x.
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      # Provision Gradle: the pinned 8.7 wrapper (./gradlew + gradle-wrapper.jar)
      # fixes the version, so runner preinstalled updates cannot change it.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
      # Validate all workflow YAML files with python (stdlib + PyYAML fallback).
      - name: YAML syntax check (python)
        run: |
          python3 - <<'PY'
          import glob, sys
          try:
              import yaml
              has_yaml = True
          except ImportError:
              has_yaml = False
              print("PyYAML not available, falling back to basic parse check")
          files = sorted(glob.glob(".github/workflows/*.yml") + glob.glob(".github/workflows/*.yaml"))
          if not files:
              print("no workflow yaml files found")
              sys.exit(0)
          ok = True
          for f in files:
              try:
                  with open(f, encoding="utf-8") as fh:
                      text = fh.read()
                  if has_yaml:
                      yaml.safe_load(text)
                  else:
                      assert text.strip(), f"empty file: {f}"
                  print(f"OK: {f}")
              except Exception as e:
                  print(f"FAIL: {f}: {e}")
                  ok = False
          sys.exit(0 if ok else 1)
          PY
      # Compile all modules (app APK + hook/core AARs). No swallow-echo fallback here:
      # any compilation failure must propagate a nonzero exit code and fail the job.
      # Phase A2: wrapper is committed, so always use ./gradlew (pinned Gradle 8.7).
      - name: Assemble app, hook, core (debug)
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug :hook:assembleDebug :core:assembleDebug --no-daemon
      # B2: verify ShizukuProvider survives into the built DEX (guards provider dep regressions).
      # Uses only shell/unzip/grep (runner built-ins); no apkanalyzer to avoid missing SDK components.
      - name: APK ShizukuProvider DEX check
        run: |
          set -e
          echo "== (a) manifest declares rikka.shizuku.ShizukuProvider =="
          grep -F "rikka.shizuku.ShizukuProvider" app/src/main/AndroidManifest.xml
          echo "== (b) DEX contains ShizukuProvider =="
          APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK" ]; then
            echo "FAIL: $APK not found; run :app:assembleDebug first"
            exit 1
          fi
          FOUND=0
          for dex in $(unzip -l "$APK" | grep -o 'classes[0-9]*\.dex'); do
            echo "--- scanning $dex ---"
            if unzip -p "$APK" "$dex" | grep -q "ShizukuProvider"; then
              echo "FOUND ShizukuProvider in $dex"
              FOUND=1
            fi
          done
          if [ "$FOUND" -eq 0 ]; then
            echo "FAIL: ShizukuProvider class string not found in $APK"
            exit 1
          fi
          echo "PASS: ShizukuProvider present in manifest and DEX"
      # D1: verify the hook entry survives into the single APK (guards packaging regressions).
      # Uses only shell/unzip/grep (runner built-ins); no apkanalyzer to avoid missing SDK components.
      - name: APK hook entry check
        run: |
          set -e
          APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK" ]; then
            echo "FAIL: $APK not found; run :app:assembleDebug first"
            exit 1
          fi
          echo "== (a) META-INF/xposed resources present in APK =="
          for entry in META-INF/xposed/java_init.list META-INF/xposed/module.prop META-INF/xposed/scope.list; do
            if unzip -l "$APK" | grep -Fq "$entry"; then
              echo "FOUND $entry"
            else
              echo "FAIL: $entry missing in $APK"
              exit 1
            fi
          done
          echo "== (b) java_init.list points at DualHook =="
          if unzip -p "$APK" META-INF/xposed/java_init.list | grep -Fq "com.galaxydual.hook.DualHook"; then
            echo "FOUND DualHook entry in java_init.list"
          else
            echo "FAIL: DualHook entry missing in META-INF/xposed/java_init.list"
            exit 1
          fi
          echo "== (c) DEX contains DualHook =="
          FOUND=0
          for dex in $(unzip -l "$APK" | grep -o 'classes[0-9]*\.dex'); do
            echo "--- scanning $dex ---"
            if unzip -p "$APK" "$dex" | grep -q "DualHook"; then
              echo "FOUND DualHook in $dex"
              FOUND=1
            fi
          done
          if [ "$FOUND" -eq 0 ]; then
            echo "FAIL: DualHook class string not found in $APK"
            exit 1
          fi
          echo "PASS: hook entry (DualHook + xposed resources) present in APK"
      # Run :core + :hook unit tests. Failures fail the job.
      - name: Unit tests (core debug)
        run: |
          chmod +x ./gradlew
          ./gradlew :core:testDebugUnitTest :hook:testDebugUnitTest --no-daemon
      # Always keep test reports, even when the test step fails.
      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: |
            **/build/reports/tests/
            **/build/test-results/
          if-no-files-found: warn
      # NOTE: no ktlint plugin is applied in this repo (see gradle/libs.versions.toml),
      # so the old `ktlintCheck` placeholder step is replaced with the zero-dependency
      # Android Lint task built into AGP. If the `lint` task ever stops existing,
      # Gradle exits nonzero and this step fails the job (no silent fallback).
      - name: Android Lint (AGP built-in)
        run: |
          chmod +x ./gradlew
          ./gradlew lint --no-daemon
      # Always keep lint reports, even when the lint step fails.
      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-reports
          path: |
            **/build/reports/lint-results*.html
            **/build/reports/lint-results*.xml
          if-no-files-found: warn
