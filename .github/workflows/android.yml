# CI: build and lint the skeleton on every push/PR.
name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Check out the repository.
      - uses: actions/checkout@v4
      # Provision JDK 17 required by AGP 8.x and Kotlin 2.x.
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      # Provision Gradle (wrapper jar is a placeholder in this repo).
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
      # Validate all workflow YAML files with python (stdlib + PyYAML fallback).
      - name: YAML syntax check (python)
        run: |
          python3 - <<'PY'
          import glob, sys
          try:
              import yaml
              has_yaml = True
          except ImportError:
              has_yaml = False
              print("PyYAML not available, falling back to basic parse check")
          files = sorted(glob.glob(".github/workflows/*.yml") + glob.glob(".github/workflows/*.yaml"))
          if not files:
              print("no workflow yaml files found")
              sys.exit(0)
          ok = True
          for f in files:
              try:
                  with open(f, encoding="utf-8") as fh:
                      text = fh.read()
                  if has_yaml:
                      yaml.safe_load(text)
                  else:
                      assert text.strip(), f"empty file: {f}"
                  print(f"OK: {f}")
              except Exception as e:
                  print(f"FAIL: {f}: {e}")
                  ok = False
          sys.exit(0 if ok else 1)
          PY
      # Compile the pure-Kotlin core module; wrapper is a placeholder so fall back gracefully.
      - name: Assemble core debug (placeholder)
        run: |
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew :core:assembleDebug --no-daemon || echo "core assemble pending real sources"
          else
            gradle :core:assembleDebug --no-daemon || echo "core assemble pending real sources / wrapper placeholder"
          fi
      # Build the app APK so the DEX check below has app-debug.apk on clean runners.
      - name: Assemble app debug
        run: |
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew :app:assembleDebug --no-daemon
          else
            gradle :app:assembleDebug --no-daemon
          fi
      # B2: verify ShizukuProvider survives into the built DEX (guards provider dep regressions).
      # Uses only shell/unzip/grep (runner built-ins); no apkanalyzer to avoid missing SDK components.
      - name: APK ShizukuProvider DEX check
        run: |
          set -e
          echo "== (a) manifest declares rikka.shizuku.ShizukuProvider =="
          grep -F "rikka.shizuku.ShizukuProvider" app/src/main/AndroidManifest.xml
          echo "== (b) DEX contains ShizukuProvider =="
          APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK" ]; then
            echo "FAIL: $APK not found; run :app:assembleDebug first"
            exit 1
          fi
          FOUND=0
          for dex in $(unzip -l "$APK" | grep -o 'classes[0-9]*\.dex'); do
            echo "--- scanning $dex ---"
            if unzip -p "$APK" "$dex" | grep -q "ShizukuProvider"; then
              echo "FOUND ShizukuProvider in $dex"
              FOUND=1
            fi
          done
          if [ "$FOUND" -eq 0 ]; then
            echo "FAIL: ShizukuProvider class string not found in $APK"
            exit 1
          fi
          echo "PASS: ShizukuProvider present in manifest and DEX"
      # ktlint placeholder: passes when the plugin is not applied yet.
      - name: ktlint (placeholder)
        run: |
          if [ -f ./gradlew ]; then
            ./gradlew ktlintCheck --no-daemon || echo "ktlint pending real sources"
          else
            gradle ktlintCheck --no-daemon || echo "ktlint pending real sources"
          fi
