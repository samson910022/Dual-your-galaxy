# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
org.gradle.caching=true
org.gradle.parallel=true
# Stage2 (hook-policy-source P1): io.github.libxposed:service:102.0.0, its
# transitive :interface:102.0.0, and :hook's compileOnly :api:102.0.0 all declare
# AAR metadata minCompileSdk=37, but this project compiles against SDK 34 on the
# AGP 8.5.2 baseline. GalaxyApp only uses XposedServiceHelper/XposedService/
# RemotePreferences, which need framework APIs available in 34; suppress the
# metadata guard project-wide (this flag covers service, interface, AND api)
# rather than moving the whole app to an unsupported compileSdk. The API 29
# instrumentation run (android.yml, minSdk floor) exercises class loading and
# provider instantiation on the older platform, but the SendBinder path (the
# GuardXposedProvider UID-gated binder handoff) remains DEVICE-UNVERIFIED.
# 遷移計畫 (Phase 5)：待下個 AGP/compileSdk 升級窗口（compileSdk 37，需 AGP
# 支援 37＋CI emulator/API 矩陣同步更新，見 docs/ARCHITECTURE.md Build-note）
# 即移除本 flag 並以 compileSdk 37 全量編譯驗證；此前維持 34＋suppress，
# 不做部分升級。TTL 註記：POLICY_IO_TIMEOUT_MS（DualViewModel 10s 有界超時，
# binder IPC 長 pin 防餓死）與本 flag 無關，僅同為「有界等待」契約。
android.experimental.disableCompileSdkChecks=true
# CI egress can stall on services.gradle.org / github releases (504/timeout); ride out transient stalls.
# Network retry/timeouts for flaky dependency downloads / 網路重試與逾時（緩解 504 等暫時性下載失敗）
systemProp.org.gradle.internal.http.connectionTimeout=60000
systemProp.org.gradle.internal.http.socketTimeout=120000
systemProp.org.gradle.internal.repository.max.tentatives=5
systemProp.org.gradle.internal.repository.initial.backoff=1000
